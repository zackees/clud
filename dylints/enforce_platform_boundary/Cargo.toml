[package]
name = "enforce_platform_boundary"
# Bump whenever the embedded baseline changes: setup-soldr's Dylint cache
# hashes the manifest but not src/baseline.txt.
version = "0.1.0"
description = "Confine host-platform selection and native APIs to clud's platform boundary"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "6.0.3"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]
