# `act` for .github/workflows/ci.yml's Linux jobs. See "Local validation
# before remote CI" in docs/architecture/ci.md. act runs in this small
# container and drives the host Docker engine through the mounted socket, so
# the job containers it starts are siblings, not nested ones, and sit outside
# bosn's managed registry. ci/act_ci.sh passes --rm so they don't pile up.
[stack.clud_act]
dockerfile = "bosn/act.Dockerfile"
workdir = "/workspace"

[stack.clud_act.mounts.source]
source = "."
destination = "/workspace"
readonly = true

[stack.clud_act.mounts.docker]
source = "/var/run/docker.sock"
destination = "/var/run/docker.sock"

# Host-visible act logs (#1548): ci/act_ci.sh tees act's output here, so it
# can be followed with `tail -f .clud/act-logs/<run>-<job>.log` while a job
# runs and survives a timeout, Ctrl-C or container removal. `.clud/*` is
# gitignored, and the script keeps the directory user-only.
[stack.clud_act.mounts.act-logs]
source = ".clud/act-logs"
destination = "/act-logs"

[stack.clud_act.volumes.act-cache]
scope = "machine"
destination = "/root/.cache/act"

# act's built-in Actions cache server (`--cache-server-path` in
# ci/act_ci.sh). Every `actions/cache`, setup-uv and setup-soldr cache the jobs
# save lands here, so the next run restores the venv, the Rust toolchain and
# soldr's zccache build cache instead of starting cold.
[stack.clud_act.volumes.act-server-cache]
scope = "machine"
destination = "/root/.cache/actcache"

[task.act-ci-list]
stack = "clud_act"
cmd = "sh /workspace/ci/act_ci.sh --list"
github_api = "proxy"

[task.act-ci-static]
stack = "clud_act"
cmd = "sh /workspace/ci/act_ci.sh static"
github_api = "proxy"

[task.act-ci-linux]
stack = "clud_act"
cmd = "sh /workspace/ci/act_ci.sh test-linux-x64-unit"
github_api = "proxy"

[task.act-rm-protection]
stack = "clud_act"
cmd = "sed 's@act pull_request -W .github/workflows/ci.yml -j@act workflow_dispatch -W .github/workflows/rm-protection-docker.yml -j@' /workspace/ci/act_ci.sh | sh -s rm-protection"
github_api = "proxy"

