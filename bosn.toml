# Linux validation stack.  The checkout is deliberately read-only; all Python,
# Cargo, Rustup, and uv build state lives in bosn-managed volumes instead.
[stack.clud_1044_final_retry]
dockerfile = "bosn/Dockerfile"
default = true
workdir = "/workspace"
tmpfs = ["/mount-probe:rw,exec,mode=1777"]

[stack.clud_1044_final_retry.mounts.source]
source = "."
destination = "/workspace"
readonly = true

[stack.clud_1044_final_retry.mounts.probe]
source = "."
destination = "/mount-probe/parent/mounted"
readonly = true

[stack.clud_1044_final_retry.volumes.target]
scope = "stack"
destination = "/build/target"

[stack.clud_1044_final_retry.volumes.venv]
scope = "stack"
destination = "/workspace/.venv"

[stack.clud_1044_final_retry.volumes.dist]
scope = "stack"
destination = "/workspace/dist"

[stack.clud_1044_final_retry.volumes.uv-cache]
scope = "machine"
destination = "/root/.cache/uv"

[stack.clud_1044_final_retry.volumes.ruff-cache]
scope = "machine"
destination = "/root/.cache/ruff"

[stack.clud_1044_final_retry.volumes.cargo-home]
scope = "machine"
destination = "/root/.cargo"

[stack.clud_1044_final_retry.volumes.rustup-home]
scope = "machine"
destination = "/root/.rustup"

[stack.clud_1044_final_retry.volumes.soldr-home]
scope = "stack"
destination = "/root/.soldr"

[stack.clud_1044_final_retry.env]
CARGO_TARGET_DIR = "/build/target"
UV_CACHE_DIR = "/root/.cache/uv"
RUFF_CACHE_DIR = "/root/.cache/ruff"
GIT_CONFIG_COUNT = "1"
GIT_CONFIG_KEY_0 = "safe.directory"
GIT_CONFIG_VALUE_0 = "/workspace"
# This repository pins Soldr through its packaging/CI flow rather than a
# rust-toolchain.toml; the image itself pins Rust 1.95.0.
