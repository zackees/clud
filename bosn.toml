# Linux validation stack.  The checkout is deliberately read-only; all Python,
# Cargo, Rustup, and uv build state lives in bosn-managed volumes instead.
[stack.clud_1044_validation]
dockerfile = "bosn/Dockerfile"
default = true
workdir = "/workspace"

[stack.clud_1044_validation.mounts.source]
source = "."
destination = "/workspace"
readonly = true

[stack.clud_1044_validation.volumes.target]
scope = "stack"
destination = "/workspace/target"

[stack.clud_1044_validation.volumes.venv]
scope = "stack"
destination = "/workspace/.venv"

[stack.clud_1044_validation.volumes.uv-cache]
scope = "machine"
destination = "/root/.cache/uv"

[stack.clud_1044_validation.volumes.cargo-home]
scope = "machine"
destination = "/root/.cargo"

[stack.clud_1044_validation.volumes.rustup-home]
scope = "machine"
destination = "/root/.rustup"

[stack.clud_1044_validation.env]
CARGO_TARGET_DIR = "/workspace/target"
UV_CACHE_DIR = "/root/.cache/uv"
# This repository pins Soldr through its packaging/CI flow rather than a
# rust-toolchain.toml; the image itself pins Rust 1.94.
SOLDR_ALLOW_UNPINNED = "1"

[task.lint]
stack = "clud_1044_validation"
cmd = "cd /workspace && bash lint"

[task.focused-test]
stack = "clud_1044_validation"
cmd = "cd /workspace && soldr cargo test -p clud --lib daemon::headless_adapter"

[task.api-discovery-test]
stack = "clud_1044_validation"
cmd = "cd /workspace && soldr cargo test -p clud --lib daemon::http::tests::api_discovery_routes_require_bearer_and_return_json"

[task.api-session-test]
stack = "clud_1044_validation"
cmd = "cd /workspace && soldr cargo test -p clud --lib daemon::api_sessions"

[task.api-turn-controller-test]
stack = "clud_1044_validation"
cmd = "cd /workspace && soldr cargo test -p clud --lib daemon::api_sessions && soldr cargo test -p clud --lib daemon::api_turn_controller && soldr cargo test -p clud --test api_turn_controller"

[task.api-session-lifecycle-test]
stack = "clud_1044_validation"
cmd = "cd /workspace && soldr cargo test -p clud --lib daemon::api_sessions && soldr cargo test -p clud --lib daemon::api_turn_controller && soldr cargo test -p clud --lib daemon::api_session_lifecycle && soldr cargo test -p clud --test api_turn_controller && soldr cargo test -p clud --test api_session_lifecycle"

[task.api-session-integration-test]
stack = "clud_1044_validation"
cmd = "cd /workspace && cargo test -p clud --lib daemon::api_sessions && cargo test -p clud --lib daemon::api_turn_controller && cargo test -p clud --lib daemon::api_session_lifecycle && cargo test -p clud --lib daemon::http::tests && cargo test -p clud --lib daemon::wire_prost && cargo test -p clud --lib command:: && cargo test -p clud --test api_turn_controller && cargo test -p clud --test api_session_lifecycle"

[task.test]
stack = "clud_1044_validation"
cmd = "cd /workspace && bash test"
