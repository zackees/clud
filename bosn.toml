# Linux validation stack.  The checkout is deliberately read-only; all Python,
# Cargo, Rustup, and uv build state lives in bosn-managed volumes instead.
[stack.linux]
dockerfile = "bosn/Dockerfile"
default = true
workdir = "/workspace"

[stack.linux.mounts.source]
source = "."
destination = "/workspace"
readonly = true

[stack.linux.volumes.target]
scope = "stack"
destination = "/workspace/target"

[stack.linux.volumes.venv]
scope = "stack"
destination = "/workspace/.venv"

[stack.linux.volumes.uv-cache]
scope = "machine"
destination = "/root/.cache/uv"

[stack.linux.volumes.cargo-home]
scope = "machine"
destination = "/root/.cargo"

[stack.linux.volumes.rustup-home]
scope = "machine"
destination = "/root/.rustup"

[stack.linux.env]
CARGO_TARGET_DIR = "/workspace/target"
UV_CACHE_DIR = "/root/.cache/uv"
# This repository pins Soldr through its packaging/CI flow rather than a
# rust-toolchain.toml; the image itself pins Rust 1.94.
SOLDR_ALLOW_UNPINNED = "1"

[task.lint]
stack = "linux"
cmd = "cd /workspace && bash lint"

[task.focused-test]
stack = "linux"
cmd = "cd /workspace && soldr cargo test -p clud --lib daemon::headless_adapter"

[task.test]
stack = "linux"
cmd = "cd /workspace && bash test"
