# ci-attestations (zackees/ci.yml GATE-010). See
# docs/architecture/ci.md#attested-skip-gate-008010.
#
# Optional local diagnostic mappings. Hosted CI does not consume local
# receipts or waive PR jobs; every selected hosted PR check executes.
# Each gate is one check a routine PR lane runs, named
# <ecosystem>/<platform>/<check>. `lane` is the local-gate.toml lane whose
# pass proves it: `ci-lint local-gate run` writes one `Ci-Attestation:`
# trailer per gate into the commit message (never into the tree). A gate
# with no trailer was not run locally.
#
# `jobs` maps hosted jobs to optional local checks. These declarations do
# not grant a hosted skip. Main-push reuse uses separate verified CI evidence.
version: 1
gates:
  general/all/static: {lane: static}                       # ci/lint.py --static-only
  rust/x86_64-unknown-linux-gnu/clippy: {lane: clippy}     # clippy + doc-tests
  rust/x86_64-unknown-linux-gnu/dylint: {lane: dylint}     # host pass
  rust/x86_64-pc-windows-msvc/dylint: {lane: dylint}       # cross-target pass
  rust/aarch64-apple-darwin/dylint: {lane: dylint}         # cross-target pass
  rust/x86_64-unknown-linux-gnu/build: {lane: build}      # bins, harnesses, wheel
  rust/x86_64-unknown-linux-gnu/unit: {lane: unit}       # rust + both pytest shards
jobs:
  ci.yml:static-checks: [general/all/static]
  ci.yml:dylint:
    - rust/x86_64-unknown-linux-gnu/dylint
    - rust/x86_64-pc-windows-msvc/dylint
    - rust/aarch64-apple-darwin/dylint
  ci.yml:lint-linux-x64: [rust/x86_64-unknown-linux-gnu/clippy]
  ci.yml:build-linux-x64: [rust/x86_64-unknown-linux-gnu/build]
  ci.yml:test-linux-x64-unit: [rust/x86_64-unknown-linux-gnu/unit]
