name: Setup build toolchain
description: >
  Python + uv + venv cache + mold + soldr-managed Rust, plus any cross-compile
  tooling the requested target needs. Used only by jobs that compile. Exec jobs
  use ../setup-exec, which deliberately has no Rust toolchain.

inputs:
  target:
    description: Rust target triple this job will build.
    required: true
  strategy:
    description: 'native | zigbuild | soldr'
    required: true
  profile:
    description: 'dev | release. Keeps the dependency cook aligned with the real build.'
    required: false
    default: dev
  soldr-token:
    description: >
      GITHUB_TOKEN, forwarded as SOLDR_GITHUB_TOKEN. soldr resolves managed
      tools through the GitHub releases API across repositories (PyO3/maturin)
      and refuses to reuse GITHUB_TOKEN for a foreign repo, so unauthenticated
      lookups hit the 60 req/hr per-IP limit and return 403. This is soldr's
      documented escape hatch. See zackees/soldr#1879.
    required: true
  toolchain:
    description: Rust toolchain version (must match rust-toolchain.toml).
    required: false
    default: "1.94.1"
  soldr-version:
    description: >
      Must exactly match pyproject.toml's soldr build-backend pin and every
      other setup-soldr version. The backend and these shims share one daemon
      socket, and mixing protocol versions resets the connection (#580).
    required: false
    default: "0.8.30"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: false

    # Keyed on OS+arch even though every build job now runs on the same Linux
    # image: a venv holds platform-specific wheels, so a shared key would hand a
    # Linux venv to any future non-Linux builder.
    - name: Cache venv
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-build-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('uv.lock') }}
        restore-keys: |
          venv-build-${{ runner.os }}-${{ runner.arch }}-py3.11-

    - name: Install mold linker
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t microsoft_sources < <(grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d 2>/dev/null || true)
        if [ "${#microsoft_sources[@]}" -gt 0 ]; then
          sudo rm -f "${microsoft_sources[@]}"
        fi
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends mold

    # setup-soldr owns Rust provisioning plus build/target caching (#68).
    # Shims keep every cargo entry point -- including maturin-spawned cargo and
    # the inner cargo of any cross wrapper -- routed through soldr/zccache.
    # mold is installed first so dependency cooking and the real build see the
    # same `linker: fast` environment.
    #
    # cache-key-suffix is the target triple: the cache is now fragmented only
    # by what actually changes the artifacts, not by job type.
    - name: Setup soldr
      uses: zackees/setup-soldr@v0.9.66
      env:
        # Must be exported for THIS step, not just declared as an input:
        # setup-soldr's managed-tool lookups read it from the environment. A
        # missing token means unauthenticated GitHub API calls at 60 req/hr per
        # runner IP, shared by every concurrent job, which returns 403 and fails
        # the build even when a usable maturin is already cached.
        SOLDR_GITHUB_TOKEN: ${{ inputs.soldr-token }}
      with:
        toolchain: ${{ inputs.toolchain }}
        version: ${{ inputs.soldr-version }}
        cache: true
        build-cache-mode: thin
        shims: true
        linker: ${{ runner.os == 'macOS' && 'platform-default' || 'fast' }}
        preserve-source-mtimes: true
        solo-toolchain-cache: true
        cache-key-suffix: build-${{ inputs.target }}
        # Cross lanes skip the dependency cook: setup-soldr runs before the
        # target SDK/toolchain is prepared below, so a cook here would compile
        # host artifacts that the foreign target cannot reuse. The first
        # windows-msvc validation run proved the failure mode: six minutes of
        # release-profile cooking followed by 393 dev-profile misses (0% reuse).
        #
        # A blanket 'none' sat here as a workaround for zackees/soldr#1880
        # (hydrate restored build-script binaries without the executable bit,
        # so cargo died with "Permission denied (os error 13)" on a rotating,
        # arbitrary crate). Fixed upstream by soldr#1889 and soldr#1914,
        # shipped in v0.8.25/v0.8.26 -- both below the version pinned above.
        # Validated on ubuntu-24.04-arm, the platform in the original report:
        # an exact-match hydrate of 8854 files now runs cleanly.
        prebuild-deps: ${{ inputs.strategy == 'native' && 'soldr-cook' || 'none' }}
        prebuild-deps-flags: ${{ inputs.profile == 'release' && '--release' || '' }}

    # soldr's blessed cross-compile bootstrap -- one invocation shape for every
    # triple, dispatching internally on the target (soldr docs/CROSS_COMPILE.md):
    #
    #   *-pc-windows-msvc   LLVM toolchain + the vendored xwin MSVC CRT cache
    #   *-apple-darwin      the target-shaped Apple SDK, exported as SDKROOT
    #   *-unknown-linux-*   the blessed Linux prep (dispatch=blessed-linux)
    #   all                 rustup target add <triple>
    #
    # The Linux arm is why this pin moved to 0.8.30. Through 0.8.28 that arm
    # printed `dispatch=zigbuild` and provisioned a managed zig WITHOUT
    # exporting its bin dir, so the later `cargo zigbuild` died with
    # "Failed to find zig" -- `main`'s Build linux-arm lane, red for 20+ runs
    # (clud#732). 0.8.30 routes Linux through the same
    # `target_lifecycle::prepare_target` + `apply_blessed_prep_env` path the
    # msvc/darwin arms use, which writes the toolchain PATH into $GITHUB_ENV.
    #
    # It then exports the target-scoped Cargo/cc-rs/linker env into $GITHUB_ENV,
    # which is what lets the later `cargo test --no-run` / maturin steps link a
    # foreign binary without each one re-deriving the toolchain.
    #
    # This replaces hand-rolled `taiki-e/install-action` pins of cargo-xwin and
    # cargo-zigbuild plus an `apt-get install clang lld llvm`. soldr's own CI
    # deleted the equivalent steps in zackees/soldr#857 once its auto-bootstrap
    # (`fetch::ensure_llvm_toolchain` + `prepare_xwin_env`) proved sufficient.
    # `cargo xwin` / `cargo zigbuild` remain reachable, but soldr documents them
    # as the explicit legacy passthrough, not the default surface.
    - name: Prepare cross toolchain
      if: inputs.strategy != 'native'
      shell: bash
      run: |
        set -euo pipefail
        # NB: this prep is for the compile and test steps only -- it has no
        # say in the shipped wheel's glibc floor. The variables it exports
        # (CC_<triple>, CARGO_TARGET_<T>_LINKER, ...) are the same ones
        # cargo-zigbuild installs its 2.17 shims into, and cargo-zigbuild
        # yields to whatever is already set, so `ci/xbuild.py` drops them for
        # the release wheel build and lets zig own that link end to end.
        # Neither soldr's `<triple>.<glibc>` spelling (soldr#2139, absent from
        # the pinned 0.8.30) nor maturin's `--target` can carry the floor;
        # `--compatibility manylinux2014 --zig` is what does.
        "${SOLDR_BINARY:-soldr}" prepare \
          --target "${{ inputs.target }}" \
          --github-env "$GITHUB_ENV"
        # `soldr prepare` can keep target rust-std in its managed sysroot, while
        # plain Cargo verbs such as clippy and test --no-run use rustup's
        # sysroot. Install the target there too so those verbs can find `core`.
        rustup target add "${{ inputs.target }}"

    # The soldr-cook prebuild can dirty the worktree; restore it so the real
    # build compiles the checked-out source.
    - name: Restore source checkout
      shell: bash
      run: |
        set -euo pipefail
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "::group::Files changed by dependency prebuild"
          git diff --name-only
          git diff --cached --name-only
          echo "::endgroup::"
          git restore --staged --worktree -- .
        fi

    - name: Sync
      shell: bash
      run: uv sync --frozen --group dev --no-install-project --python 3.11

    # Export the synced venv's interpreter and use it directly everywhere
    # instead of `uv run`. `pyproject.toml:1-3` sets `build-backend = "soldr"`,
    # so `uv run` (without --no-project) syncs the *project*, which triggers a
    # full PEP 517 maturin build of the Rust binary before your command starts.
    # The repo's own `lint` script (lint:8-24) already worked around this for
    # the same reason. `uv run --no-project` is not an alternative: it would
    # discard the dev dependencies these steps need.
    - name: Export venv interpreter
      shell: bash
      run: |
        set -euo pipefail
        if [ -x .venv/Scripts/python.exe ]; then
          echo "VENV_PY=$(pwd)/.venv/Scripts/python.exe" >> "$GITHUB_ENV"
        elif [ -x .venv/bin/python ]; then
          echo "VENV_PY=$(pwd)/.venv/bin/python" >> "$GITHUB_ENV"
        else
          echo "::error::no .venv/{Scripts,bin}/python after uv sync"
          exit 1
        fi
