name: Unit Test Template

on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string

jobs:
  unit-test:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
      # Issue #13 follow-up: whisper-rs-sys vendors `std::filesystem::path`
      # which requires macOS 10.15+. Rust on stable defaults to 10.12,
      # which fails on the macos-15-intel runner. Force-bump so the
      # vendored C++ build sees the modern SDK target on every macOS
      # job (no-op on Linux/Windows).
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CFLAGS: "-g0"
      CXXFLAGS: "-g0"
      CLUD_USE_SOLDR_SHIMS: "1"
      # soldr resolves managed tools (maturin) through the GitHub
      # releases API. That lookup crosses repositories (PyO3/maturin),
      # and soldr deliberately refuses to reuse GITHUB_TOKEN for a repo
      # other than the one being built -- so it goes out unauthenticated
      # at 60 req/hr per runner IP, shared by every concurrent job, and
      # returns HTTP 403. soldr then fails the build outright even when a
      # usable maturin is already cached. SOLDR_GITHUB_TOKEN is soldr's
      # own documented escape hatch and always wins, raising the limit to
      # 1000/hr. See zackees/soldr#1879.
      SOLDR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ inputs.runs-on }}-py3.11-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ inputs.runs-on }}-py3.11-

      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t microsoft_sources < <(grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d 2>/dev/null || true)
          if [ "${#microsoft_sources[@]}" -gt 0 ]; then
            sudo rm -f "${microsoft_sources[@]}"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mold

      # Issue #68: setup-soldr owns Rust provisioning plus build/target caching.
      # Shims keep ci/test.py's back-to-back cargo build / cargo test --no-run /
      # cargo test invocations routed through soldr/zccache. Install mold before
      # setup so dependency cooking and tests share the same linker fingerprint.
      - name: Setup soldr
        uses: zackees/setup-soldr@v0.9.66
        with:
          toolchain: "1.94.1"
          # Must satisfy pyproject.toml's `requires = ["soldr>=0.8.27"]`:
          # the PEP 517 backend and these shims share one daemon socket, and
          # mixing protocol versions across it resets the connection (#580).
          version: "0.8.27"
          cache: true
          build-cache-mode: thin
          shims: true
          linker: ${{ runner.os == 'macOS' && 'platform-default' || 'fast' }}
          preserve-source-mtimes: true
          solo-toolchain-cache: true
          # TEMPORARY (zackees/soldr#1880): the soldr-cook prebuild restores
          # a cached target/ tree whose build-script-build binaries come back
          # without the executable bit, so cargo dies with "Permission denied
          # (os error 13)" on a rotating, arbitrary crate. Re-running does not
          # help -- the same cache entry is restored again. Windows already ran
          # with 'none' and never hit this, which is what identified the cook
          # prebuild as the trigger. Restore the conditional once soldr ships
          # the fix. Costs a cold dependency build, not correctness.
          prebuild-deps: none
          prebuild-deps-flags: "--workspace"

      - name: Restore source checkout
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::group::Files changed by dependency prebuild"
            git diff --name-only
            git diff --cached --name-only
            echo "::endgroup::"
            git restore --staged --worktree -- .
          fi

      - name: Sync
        run: uv sync --frozen --group dev --no-install-project --python 3.11 -v

      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Linux" ]; then
            ulimit -v 13000000
          fi
          uv run --no-editable -m ci.lint

      - name: Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Linux" ]; then
            ulimit -v 13000000
          fi
          uv run --no-editable -m ci.test

      - name: Diagnose Linux build failure
        if: ${{ failure() && runner.os == 'Linux' }}
        shell: bash
        run: |
          set +e
          echo "::group::OOM / killed-process scan"
          (sudo dmesg 2>/dev/null || dmesg 2>/dev/null) | grep -iE 'killed|oom|out of memory|signal 9' | tail -50
          [ $? -ne 0 ] && echo "(no OOM/kill messages found)"
          echo "::endgroup::"
          echo "::group::Last 100 dmesg lines"
          (sudo dmesg 2>/dev/null || dmesg 2>/dev/null) | tail -100
          echo "::endgroup::"
          echo "::group::Memory snapshot"
          free -h
          echo "::endgroup::"
          echo "::group::Disk snapshot"
          df -h
          echo "::endgroup::"

      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-unit-test-${{ inputs.runs-on }}
          path: logs/*
          if-no-files-found: warn
