name: Installer acceptance

on:
  pull_request:
    paths:
      - installer/**
      - tests/test_installer_*.py
      - crates/clud-bin/**
      - ci/ci_matrix.py
      - ci/xbuild.py
      - ci/installer_candidate.py
      - ci/bundle.py
      - ci/act_ci.sh
      - .github/workflows/_build-target.yml
      - .github/workflows/_run-tests.yml
      - .github/workflows/ci.yml
      - .github/actions/setup-build/**
      - .github/workflows/install-pages.yml
      - site/**
      - docs/architecture/native-installer.md
      - docs/architecture/installer-pages.md
      - Cargo.toml
      - Cargo.lock
      - pyproject.toml
      - .github/workflows/installer-check.yml
      - .github/workflows/auto-release.yml
      - bosn.toml
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Published tag whose installer should be tested.
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate-build:
    name: Build exact PR candidate ${{ matrix.target }}
    if: github.event_name != 'workflow_call'
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      target: ${{ matrix.target }}
      runs-on: ubuntu-24.04
      strategy: soldr
      profile: dev
      bundle: false
      clippy: false
      candidate-artifact: candidate-${{ matrix.target }}

  candidate-catalog:
    name: Bind all six candidate assets into one catalog
    needs: candidate-build
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: candidate-artifacts
      - name: Verify exact source and build candidate catalog
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          python -m ci.installer_candidate build-fixture candidate-artifacts candidate-fixture "$SOURCE_SHA" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-catalog
          path: candidate-fixture/catalog.json
          if-no-files-found: error

  candidate-host:
    name: Run exact PR candidate on ${{ matrix.runner }}
    needs: candidate-catalog
    if: github.event_name != 'workflow_call'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CLUD_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CLUD_CANDIDATE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ matrix.target }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: candidate-catalog
          path: candidate-fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native acceptance dependencies
        shell: bash
        run: |
          python -m pip install pytest==9.0.3 running-process==4.10.1
          if [ "$RUNNER_OS" = Windows ]; then python -m pip install pywinpty==3.0.5; fi
      - name: Verify artifact identity and expose exact binary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path
          from ci.installer_candidate import verify_artifact
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          directory = Path('candidate').resolve()
          metadata = verify_artifact(directory, os.environ['CLUD_CANDIDATE_TARGET'], os.environ['CLUD_CANDIDATE_SHA'], version)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f"CLUD_CANDIDATE_VERSION={version}\n")
              env.write(f"CLUD_CANDIDATE_ARTIFACT={directory}\n")
              env.write(f"CLUD_CANDIDATE_EVIDENCE=candidate-evidence/{metadata['target']}.json\n")
              env.write(f"CLUD_TEST_BINARY={directory / metadata['filename']}\n")
              env.write(f"CLUD_INSTALLER_CI_FIXTURE_DIR={Path('candidate-fixture').resolve()}\n")
          assets = Path('candidate-fixture/assets')
          assets.mkdir(exist_ok=True)
          import shutil
          shutil.copy2(directory / metadata['filename'], assets / metadata['filename'])
          catalog = json.loads(Path('candidate-fixture/catalog.json').read_text(encoding='utf-8'))
          candidate_row = next(row for row in catalog['releases'] if row['version'] == version)
          os_name, arch, _, _ = __import__('ci.installer_candidate', fromlist=['TARGETS']).TARGETS[metadata['target']]
          candidate_asset = next(row['asset'] for row in candidate_row['platforms'] if row['platform']['os'] == os_name and row['platform']['arch'] == arch)
          if candidate_asset['filename'] != metadata['filename'] or candidate_asset['sha256'] != metadata['sha256'] or candidate_asset['size_bytes'] != metadata['size_bytes']:
              raise ValueError('candidate catalog differs from exact host binary')
          prior = next(row for row in catalog['releases'] if row['version'] == '2.8.13')
          selected = next(row for row in prior['platforms'] if row['platform']['os'] == os_name and row['platform']['arch'] == arch)
          asset = selected['asset']
          from urllib.request import urlopen
          import hashlib
          with urlopen(asset['urls'][0], timeout=120) as response:
              data = response.read(asset['size_bytes'] + 1)
          if len(data) != asset['size_bytes'] or hashlib.sha256(data).hexdigest() != asset['sha256']:
              raise ValueError('prior release asset differs from the published catalog')
          (assets / asset['filename']).write_bytes(data)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write('CLUD_TEST_PRIOR_VERSION=2.8.13\n')
          print(json.dumps(metadata, sort_keys=True))
          PY
          if [ "$RUNNER_OS" != Windows ]; then chmod +x candidate/clud-*; fi
      - name: Exercise native installer and terminal
        shell: bash
        run: |
          mkdir -p candidate-evidence
          python -m pytest -q \
            tests/test_installer_candidate_ci.py::test_native_candidate_installs_by_name_and_writes_host_evidence \
            tests/test_installer_native_entry.py
      - name: Retain candidate host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evidence-${{ matrix.target }}
          path: candidate-evidence/*
          if-no-files-found: warn

  candidate-aggregate:
    name: Require six exact PR candidate hosts
    needs: [catalog-unit, resolver-unit, catalog-site, candidate-build, candidate-catalog, candidate-host]
    if: always() && github.event_name != 'workflow_call'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-evidence-*
          path: candidate-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: candidate-artifacts
      - name: Reject failed or missing lanes and evidence
        env:
          CATALOG_UNIT: ${{ needs.catalog-unit.result }}
          RESOLVER_UNIT: ${{ needs.resolver-unit.result }}
          CATALOG_SITE: ${{ needs.catalog-site.result }}
          CANDIDATE_BUILD: ${{ needs.candidate-build.result }}
          CANDIDATE_CATALOG: ${{ needs.candidate-catalog.result }}
          CANDIDATE_HOST: ${{ needs.candidate-host.result }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          for result in "$CATALOG_UNIT" "$RESOLVER_UNIT" "$CATALOG_SITE" "$CANDIDATE_BUILD" "$CANDIDATE_CATALOG" "$CANDIDATE_HOST"; do
            test "$result" = success
          done
          version=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          python -m ci.installer_candidate aggregate candidate-evidence "$SOURCE_SHA" "$version" --artifacts candidate-artifacts

  catalog-unit:
    name: Native catalog and release wiring unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: |
          python -m pip install pytest running-process
          python -m pytest -q \
            tests/test_installer_catalog.py \
            tests/test_installer_candidate_ci.py \
            tests/test_installer_verify_site.py \
            tests/test_installer_verify_native_assets.py \
            tests/test_installer_release_assets.py \
            tests/test_ci_matrix.py \
            tests/test_ci_xbuild.py \
            tests/test_release_gate.py

  resolver-unit:
    name: Native Rust self-installer unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-build
        with:
          target: x86_64-unknown-linux-gnu
          strategy: soldr
          profile: dev
          soldr-token: ${{ secrets.GITHUB_TOKEN }}
      - run: 'soldr cargo test -p clud --lib self_install:: -- --test-threads=1'

  catalog-site:
    name: Published release to catalog and Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build complete site from actual published releases
        run: python -m installer.site site
      - name: Validate catalog structure and semantics
        run: |
          python -m pip install 'git+https://github.com/zackees/manifest.json@main'
          manifest-validate site/install/manifest.json
      - name: Assert exact Pages paths and latest release
        run: |
          test -f site/index.html
          test -f site/install/index.html
          test -f site/install/manifest.json
          python -m installer.verify_site site

  build-ape:
    name: Obtain installer APE
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_call'
      - uses: astral-sh/setup-uv@v5
        if: github.event_name != 'workflow_call'
        with:
          version: "0.12.19"
      - name: Compile installer APE for pull request validation
        if: github.event_name != 'workflow_call'
        run: bash installer/build_ape.sh
      - name: Download the released installer APE
        if: github.event_name == 'workflow_call'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          curl -fLsS --retry 5 \
            "https://github.com/zackees/clud/releases/download/${RELEASE_TAG}/clud-installer.exe" \
            -o clud-installer.exe
          test "$(head -c 6 clud-installer.exe)" = MZqFpD
      - uses: actions/upload-artifact@v4
        with:
          name: clud-installer-ape
          path: clud-installer.exe
          if-no-files-found: error

  ape-host:
    name: Install and verify on ${{ matrix.runner }}
    if: github.event_name == 'workflow_call'
    needs: build-ape
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            expected: linux x86_64
          - runner: ubuntu-24.04-arm
            expected: linux aarch64
          - runner: macos-15-intel
            expected: darwin x86_64
          - runner: macos-15
            expected: darwin aarch64
          - runner: windows-2025
            expected: windows x86_64
          - runner: windows-11-arm
            expected: windows aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.runner == 'windows-2025'
      - uses: actions/download-artifact@v4
        with:
          name: clud-installer-ape
      - uses: actions/setup-python@v5
        if: matrix.runner == 'windows-2025'
        with:
          python-version: '3.13'
      - name: Install Windows ConPTY test dependencies
        if: matrix.runner == 'windows-2025'
        shell: bash
        run: python -m pip install pytest running-process pywinpty
      - name: Exercise the selector in a real Windows ConPTY
        if: matrix.runner == 'windows-2025'
        shell: bash
        run: python -m pytest -q tests/test_installer_pty.py
      - name: Launch the same downloaded APE bytes
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.expected }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CLUD_TEST_VERSION: ''
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum clud-installer.exe
          else
            shasum -a 256 clud-installer.exe
          fi
          chmod +x clud-installer.exe
          ./clud-installer.exe --version
          ./clud-installer.exe --self-test-json
          ./clud-installer.exe --self-test-catalog
          ./clud-installer.exe --self-test-tty
          ./clud-installer.exe --self-test-sha256
          ./clud-installer.exe --self-test-path
          actual=$(./clud-installer.exe --host-platform)
          echo "Detected host platform: $actual (expected $EXPECTED_PLATFORM)"
          test "$actual" = "$EXPECTED_PLATFORM"
          version=$(./clud-installer.exe --latest-stable)
          echo "Testing latest stable clud $version on $actual (installer release ${RELEASE_TAG:-PR build})"
          test -n "$version"
          if [ "$RUNNER_OS" = Windows ]; then
            testhome="$(cygpath -u "$RUNNER_TEMP")/clud-installer-home"
            mkdir -p "$testhome/AppData/Local"
            USERPROFILE="$(cygpath -w "$testhome")"
            export USERPROFILE
            # Keep the native Windows profile path intact when Git Bash starts
            # the PE APE; MSYS otherwise rewrites it into /D/... form.
            export MSYS2_ENV_CONV_EXCL=USERPROFILE
            export HOME="$USERPROFILE"
            unset LOCALAPPDATA
            env -u LOCALAPPDATA ./clud-installer.exe --install-version "$version" --yes
            # PowerShell environment variables must not be expanded by Bash.
            # shellcheck disable=SC2016
            CLUD_TEST_VERSION="$version" powershell.exe -NoLogo -NoProfile -NonInteractive -Command \
              '$d=Join-Path $env:USERPROFILE "AppData\Local\Programs\clud\bin"; $u=[Environment]::GetEnvironmentVariable("Path","User"); if(-not (($u -split ";")|Where-Object { $_ -and $_.TrimEnd([char]92) -ieq $d.TrimEnd([char]92) })) { throw "install directory missing from persistent user PATH" }; $env:Path="$u;$env:Path"; $c=Get-Command clud -CommandType Application -ErrorAction Stop; if($c.Source -ine (Join-Path $d "clud.exe")) { throw "wrong clud resolved: $($c.Source)" }; $out=& $c.Source --version; if($out -notmatch [regex]::Escape($env:CLUD_TEST_VERSION)) { throw "unexpected version: $out" }; Write-Output $c.Source; Write-Output $out'
          else
            testhome="$RUNNER_TEMP/clud-installer-home"
            mkdir -p "$testhome"
            export HOME="$testhome"
            export TMPDIR="$RUNNER_TEMP"
            if [ "$RUNNER_OS" = macOS ]; then
              test_shell=zsh
              test -x /bin/zsh
              export SHELL=/bin/zsh
            else
              test_shell=bash
              unset SHELL
            fi
            for profile in .profile .bash_profile .bash_login .bashrc .zprofile .zshrc; do
              printf '%s\n' '# clud-installer managed PATH' > "$testhome/$profile"
            done
            PATH="$testhome/.local/bin:$PATH" ./clud-installer.exe --install-version "$version" --yes
            expected_executable="$testhome/.local/bin/clud"
            resolved=$(env -u BASH_ENV PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$testhome" "$test_shell" -l -c 'command -v clud')
            test "$resolved" = "$testhome/.local/bin/clud"
            checked=$(env -u BASH_ENV PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$testhome" "$test_shell" -l -c 'clud --version')
            test "$checked" = "clud $version"
            interactive_resolved=$(env -u BASH_ENV PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$testhome" "$test_shell" -i -c 'command -v clud' 2>/dev/null)
            test "$interactive_resolved" = "$expected_executable"
            interactive_checked=$(env -u BASH_ENV PATH=/usr/bin:/bin:/usr/sbin:/sbin HOME="$testhome" "$test_shell" -i -c 'clud --version' 2>/dev/null)
            test "$interactive_checked" = "clud $version"
            echo "$resolved"
            echo "$checked"
            echo "Interactive-shell verification: $interactive_resolved -> $interactive_checked"
          fi

  ape-core-tests:
    name: APE catalog and terminal unit tests
    if: github.event_name == 'workflow_call'
    needs: build-ape
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: clud-installer-ape
      - name: Exercise catalog parsing and terminal renderer in the built APE
        run: |
          chmod +x clud-installer.exe
          python -m pip install pytest running-process
          python -m pytest -q tests/test_installer_pty.py
          ./clud-installer.exe --self-test-json
          ./clud-installer.exe --self-test-catalog
          ./clud-installer.exe --self-test-tty
          ./clud-installer.exe --self-test-sha256
          ./clud-installer.exe --self-test-path
          ./clud-installer.exe --host-platform
          ./clud-installer.exe --list

  linux-distro:
    name: Install on ${{ matrix.image }} container
    if: github.event_name == 'workflow_call'
    needs: build-ape
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - archlinux:latest
          - fedora:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clud-installer-ape
      - name: Verify downloaded release on this Linux distribution
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          container="clud-installer-${DISTRO_IMAGE//[^a-zA-Z0-9]/-}-$$"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$container" "$DISTRO_IMAGE" tail -f /dev/null
          docker exec "$container" mkdir -p /workspace/installer
          docker cp clud-installer.exe "$container:/workspace/clud-installer.exe"
          docker cp installer/test_linux_container.sh "$container:/workspace/installer/test_linux_container.sh"
          docker exec --workdir /workspace "$container" bash installer/test_linux_container.sh

  installer-acceptance:
    name: Installer acceptance aggregate
    needs: [catalog-unit, resolver-unit, catalog-site, ape-core-tests, ape-host, linux-distro]
    if: always() && github.event_name == 'workflow_call'
    runs-on: ubuntu-24.04
    steps:
      - name: Reject missing, skipped, or failed coverage
        env:
          CATALOG: ${{ needs.catalog-site.result }}
          CATALOG_UNIT: ${{ needs.catalog-unit.result }}
          RESOLVER_UNIT: ${{ needs.resolver-unit.result }}
          APE_CORE: ${{ needs.ape-core-tests.result }}
          APE_HOSTS: ${{ needs.ape-host.result }}
          LINUX_DISTROS: ${{ needs.linux-distro.result }}
        run: |
          test "$CATALOG" = success
          test "$CATALOG_UNIT" = success
          test "$RESOLVER_UNIT" = success
          test "$APE_CORE" = success
          test "$APE_HOSTS" = success
          test "$LINUX_DISTROS" = success
