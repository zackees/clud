name: Installer acceptance

on:
  # PR events are cheap when unlabeled: every job below gates on ci-full.
  # Keep labeled/unlabeled so toggling the label starts or cancels acceptance.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_call:
    inputs:
      release_tag:
        description: Published tag whose installer should be tested.
        required: true
        type: string
      mode:
        description: Candidate prerelease or canonical released catalog.
        required: false
        default: released
        type: string

permissions:
  contents: read

concurrency:
  group: installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate-build:
    name: Build exact PR candidate ${{ matrix.target }}
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      target: ${{ matrix.target }}
      runs-on: ubuntu-24.04
      strategy: soldr
      profile: dev
      bundle: false
      clippy: false
      candidate-artifact: candidate-${{ matrix.target }}

  candidate-catalog:
    name: Bind all six candidate assets into one catalog
    needs: candidate-build
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: candidate-artifacts
      - name: Verify exact source and build candidate catalog
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          version=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          python -m ci.installer_candidate build-fixture candidate-artifacts candidate-fixture "$SOURCE_SHA" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-catalog
          path: candidate-fixture/catalog.json
          if-no-files-found: error

  candidate-host:
    name: Run exact PR candidate on ${{ matrix.runner }}
    needs: candidate-catalog
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CLUD_CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CLUD_CANDIDATE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ matrix.target }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: candidate-catalog
          path: candidate-fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native acceptance dependencies
        shell: bash
        run: |
          python -m pip install pytest==9.0.3 running-process==4.10.1
          if [ "$RUNNER_OS" = Windows ]; then python -m pip install pywinpty==3.0.5; fi
      - name: Verify artifact identity and expose exact binary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path
          from ci.installer_candidate import verify_artifact
          version = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          directory = Path('candidate').resolve()
          metadata = verify_artifact(directory, os.environ['CLUD_CANDIDATE_TARGET'], os.environ['CLUD_CANDIDATE_SHA'], version)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f"CLUD_CANDIDATE_VERSION={version}\n")
              env.write(f"CLUD_CANDIDATE_ARTIFACT={directory}\n")
              env.write(f"CLUD_CANDIDATE_EVIDENCE=candidate-evidence/{metadata['target']}.json\n")
              env.write(f"CLUD_TEST_BINARY={directory / metadata['filename']}\n")
              env.write(f"CLUD_INSTALLER_CI_FIXTURE_DIR={Path('candidate-fixture').resolve()}\n")
          assets = Path('candidate-fixture/assets')
          assets.mkdir(exist_ok=True)
          import shutil
          shutil.copy2(directory / metadata['filename'], assets / metadata['filename'])
          catalog = json.loads(Path('candidate-fixture/catalog.json').read_text(encoding='utf-8'))
          candidate_row = next(row for row in catalog['releases'] if row['version'] == version)
          os_name, arch, _, _ = __import__('ci.installer_candidate', fromlist=['TARGETS']).TARGETS[metadata['target']]
          candidate_asset = next(row['asset'] for row in candidate_row['platforms'] if row['platform']['os'] == os_name and row['platform']['arch'] == arch)
          if candidate_asset['filename'] != metadata['filename'] or candidate_asset['sha256'] != metadata['sha256'] or candidate_asset['size_bytes'] != metadata['size_bytes']:
              raise ValueError('candidate catalog differs from exact host binary')
          prior = next(row for row in catalog['releases'] if row['version'] == '2.8.13')
          selected = next(row for row in prior['platforms'] if row['platform']['os'] == os_name and row['platform']['arch'] == arch)
          asset = selected['asset']
          from urllib.request import urlopen
          import hashlib
          with urlopen(asset['urls'][0], timeout=120) as response:
              data = response.read(asset['size_bytes'] + 1)
          if len(data) != asset['size_bytes'] or hashlib.sha256(data).hexdigest() != asset['sha256']:
              raise ValueError('prior release asset differs from the published catalog')
          (assets / asset['filename']).write_bytes(data)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write('CLUD_TEST_PRIOR_VERSION=2.8.13\n')
          print(json.dumps(metadata, sort_keys=True))
          PY
          if [ "$RUNNER_OS" != Windows ]; then chmod +x candidate/clud-*; fi
      - name: Exercise native installer and terminal
        shell: bash
        run: |
          mkdir -p candidate-evidence
          python -m pytest -q \
            tests/test_installer_candidate_ci.py::test_native_candidate_installs_by_name_and_writes_host_evidence \
            tests/test_installer_native_entry.py
      - name: Retain candidate host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evidence-${{ matrix.target }}
          path: candidate-evidence/*
          if-no-files-found: warn

  candidate-nixos:
    name: Real NixOS VM ${{ matrix.target }}
    needs: candidate-catalog
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ matrix.target }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: candidate-catalog
          path: candidate-fixture
      - name: Verify and stage identical candidate bytes
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil, tomllib
          from ci.installer_candidate import verify_artifact
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          metadata = verify_artifact(pathlib.Path('candidate'), os.environ['TARGET'], os.environ['SOURCE_SHA'], version)
          asset = pathlib.Path('candidate') / metadata['filename']
          fixture_asset = pathlib.Path('candidate-fixture/assets') / metadata['filename']
          fixture_asset.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(asset, fixture_asset)
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as env:
              env.write(f"CANDIDATE_FILENAME={metadata['filename']}\nCANDIDATE_VERSION={version}\nCANDIDATE_SHA256={metadata['sha256']}\n")
          print(json.dumps(metadata, sort_keys=True))
          PY
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: Boot matching NixOS architecture and install as fresh user
        timeout-minutes: 25
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.target == 'aarch64-unknown-linux-musl' && 'aarch64' || 'x86_64' }}"
          nixpkgs=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./ci/nixos)).inputs.nixpkgs.outPath')
          nix-build ci/nixos/candidate-test.nix --no-out-link \
            --argstr nixpkgs "$nixpkgs" \
            --argstr candidate "$PWD/candidate/$CANDIDATE_FILENAME" \
            --argstr fixture "$PWD/candidate-fixture" \
            --argstr version "$CANDIDATE_VERSION" \
            --argstr digest "$CANDIDATE_SHA256"

  candidate-distros:
    name: Same musl bytes on ${{ matrix.distro }}
    needs: candidate-catalog
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: archlinux
            image: archlinux@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
          - distro: fedora
            image: fedora@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
          - distro: alpine
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate-x86_64-unknown-linux-musl
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: candidate-catalog
          path: candidate-fixture
      - name: Verify exact shared asset and stage fixture
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil, tomllib
          from ci.installer_candidate import verify_artifact
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          metadata = verify_artifact(pathlib.Path('candidate'), 'x86_64-unknown-linux-musl', os.environ['SOURCE_SHA'], version)
          fixture_asset = pathlib.Path('candidate-fixture/assets') / metadata['filename']
          fixture_asset.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(pathlib.Path('candidate') / metadata['filename'], fixture_asset)
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as env:
              env.write(f"CANDIDATE_VERSION={version}\nCANDIDATE_SHA256={metadata['sha256']}\n")
          print(json.dumps(metadata, sort_keys=True))
          PY
      - name: Install and resolve on clean nonroot distribution
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD/candidate,dst=/candidate,readonly" \
            --mount "type=bind,src=$PWD/candidate-fixture,dst=/fixture,readonly" \
            --mount "type=bind,src=$PWD/ci/installer_distro_guest.sh,dst=/guest.sh,readonly" \
            '${{ matrix.image }}' sh /guest.sh '${{ matrix.distro }}' "$CANDIDATE_VERSION" "$CANDIDATE_SHA256"

  candidate-aggregate:
    name: Require six exact PR candidate hosts
    needs: [catalog-unit, resolver-unit, catalog-site, candidate-build, candidate-catalog, candidate-host, candidate-nixos, candidate-distros]
    if: always() && github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-evidence-*
          path: candidate-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: candidate-artifacts
      - name: Reject failed or missing lanes and evidence
        env:
          CATALOG_UNIT: ${{ needs.catalog-unit.result }}
          RESOLVER_UNIT: ${{ needs.resolver-unit.result }}
          CATALOG_SITE: ${{ needs.catalog-site.result }}
          CANDIDATE_BUILD: ${{ needs.candidate-build.result }}
          CANDIDATE_CATALOG: ${{ needs.candidate-catalog.result }}
          CANDIDATE_HOST: ${{ needs.candidate-host.result }}
          CANDIDATE_NIXOS: ${{ needs.candidate-nixos.result }}
          CANDIDATE_DISTROS: ${{ needs.candidate-distros.result }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          for result in "$CATALOG_UNIT" "$RESOLVER_UNIT" "$CATALOG_SITE" "$CANDIDATE_BUILD" "$CANDIDATE_CATALOG" "$CANDIDATE_HOST" "$CANDIDATE_NIXOS" "$CANDIDATE_DISTROS"; do
            test "$result" = success
          done
          version=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          python -m ci.installer_candidate aggregate candidate-evidence "$SOURCE_SHA" "$version" --artifacts candidate-artifacts

  public-host:
    name: Public ${{ inputs.mode }} native install on ${{ matrix.runner }}
    if: inputs.release_tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native acceptance dependencies
        shell: bash
        run: |
          python -m pip install pytest==9.0.3 running-process==4.10.1
          if [ "$RUNNER_OS" = Windows ]; then python -m pip install pywinpty==3.0.5; fi
      - name: Fetch anonymous HTTPS catalog and final binary, install by name
        shell: bash
        env:
          CLUD_PUBLIC_MODE: ${{ inputs.mode }}
          CLUD_PUBLIC_RELEASE_TAG: ${{ inputs.release_tag }}
          CLUD_PUBLIC_EVIDENCE: public-evidence/${{ matrix.target }}.json
        run: python -m pytest -q tests/test_installer_public_ci.py::test_public_release_installs_by_name
      - name: Retain public host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-evidence-${{ inputs.mode }}-${{ matrix.target }}
          path: public-evidence/*.json
          if-no-files-found: error

  public-nixos:
    name: Public ${{ inputs.mode }} NixOS VM ${{ matrix.target }}
    if: inputs.release_tag != ''
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact anonymous public asset digest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          MODE: ${{ inputs.mode }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from ci.installer_public_catalog import resolve
          arch = os.environ['TARGET'].split('-', 1)[0]
          asset = resolve(os.environ['MODE'], os.environ['RELEASE_TAG'], 'linux', arch)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f"PUBLIC_VERSION={asset['version']}\nPUBLIC_SHA256={asset['sha256']}\n")
          print(asset)
          PY
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: Fetch public HTTPS catalog and binary inside matching NixOS guest
        timeout-minutes: 25
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.target == 'aarch64-unknown-linux-musl' && 'aarch64' || 'x86_64' }}"
          nixpkgs=$(nix eval --raw --impure --expr '(builtins.getFlake (toString ./ci/nixos)).inputs.nixpkgs.outPath')
          driver=$(nix-build ci/nixos/public-test.nix -A config.driver --no-out-link \
            --argstr nixpkgs "$nixpkgs" \
            --argstr tag "$RELEASE_TAG" \
            --argstr version "$PUBLIC_VERSION" \
            --argstr digest "$PUBLIC_SHA256" \
            --argstr mode "$MODE")
          mkdir -p "$RUNNER_TEMP/public-nixos-result"
          "$driver/bin/nixos-test-driver" -o "$RUNNER_TEMP/public-nixos-result" 2>&1 | tee public-nixos.log
          grep -m1 'PUBLIC_NIXOS_EVIDENCE ' public-nixos.log > public-nixos-evidence.txt
      - name: Retain public NixOS guest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-nixos-evidence-${{ inputs.mode }}-${{ matrix.target }}
          path: public-nixos-evidence.txt
          if-no-files-found: warn

  public-distros:
    name: Public ${{ inputs.mode }} on ${{ matrix.distro }}
    if: inputs.release_tag != ''
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: archlinux
            image: archlinux@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
          - distro: fedora
            image: fedora@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814
          - distro: alpine
            image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact anonymous public musl digest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from ci.installer_public_catalog import resolve
          asset = resolve(os.environ['MODE'], os.environ['RELEASE_TAG'], 'linux', 'x86_64')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f"PUBLIC_VERSION={asset['version']}\nPUBLIC_SHA256={asset['sha256']}\n")
          print(asset)
          PY
      - name: Fetch public HTTPS catalog and same musl bytes inside fresh distribution
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD/ci/installer_public_distro_guest.sh,dst=/guest.sh,readonly" \
            '${{ matrix.image }}' sh /guest.sh '${{ matrix.distro }}' "$MODE" "$RELEASE_TAG" "$PUBLIC_VERSION" "$PUBLIC_SHA256" \
            2>&1 | tee public-distro.log
          grep -m1 'PUBLIC_DISTRO_EVIDENCE ' public-distro.log > public-distro-evidence.txt
      - name: Retain public distribution guest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-distro-evidence-${{ inputs.mode }}-${{ matrix.distro }}
          path: public-distro-evidence.txt
          if-no-files-found: warn

  catalog-unit:
    name: Native catalog and release wiring unit tests
    if: inputs.release_tag != '' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || contains(github.event.pull_request.labels.*.name, 'ci:full')))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: |
          python -m pip install pytest running-process
          python -m pytest -q \
            tests/test_installer_catalog.py \
            tests/test_installer_candidate_ci.py \
            tests/test_installer_public_ci.py \
            tests/test_public_release.py \
            tests/test_installer_verify_site.py \
            tests/test_installer_verify_native_assets.py \
            tests/test_installer_release_assets.py \
            tests/test_ci_matrix.py \
            tests/test_ci_xbuild.py \
            tests/test_release_gate.py

  resolver-unit:
    name: Native Rust self-installer unit tests
    if: inputs.release_tag != '' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || contains(github.event.pull_request.labels.*.name, 'ci:full')))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-build
        with:
          target: x86_64-unknown-linux-gnu
          strategy: soldr
          profile: dev
          soldr-token: ${{ secrets.GITHUB_TOKEN }}
      - run: 'soldr cargo test -p clud --lib self_install:: -- --test-threads=1'

  catalog-site:
    name: Published release to catalog and Pages
    if: inputs.release_tag != '' || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci-full') || contains(github.event.pull_request.labels.*.name, 'ci:full')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build complete site from actual published releases
        run: python -m installer.site site
      - name: Validate catalog structure and semantics
        run: |
          python -m pip install 'git+https://github.com/zackees/manifest.json@main'
          manifest-validate site/install/manifest.json
      - name: Assert exact Pages paths and latest release
        run: |
          test -f site/index.html
          test -f site/install/index.html
          test -f site/install/manifest.json
          python -m installer.verify_site site

  installer-acceptance:
    name: Installer acceptance aggregate
    needs: [catalog-unit, resolver-unit, catalog-site, public-host, public-nixos, public-distros]
    if: always() && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: public-evidence-${{ inputs.mode }}-*
          path: public-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: public-nixos-evidence-${{ inputs.mode }}-*
          path: public-nixos-evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: public-distro-evidence-${{ inputs.mode }}-*
          path: public-distro-evidence
      - name: Reject missing, skipped, or failed coverage
        env:
          CATALOG: ${{ needs.catalog-site.result }}
          CATALOG_UNIT: ${{ needs.catalog-unit.result }}
          RESOLVER_UNIT: ${{ needs.resolver-unit.result }}
          PUBLIC_HOSTS: ${{ needs.public-host.result }}
          PUBLIC_NIXOS: ${{ needs.public-nixos.result }}
          PUBLIC_DISTROS: ${{ needs.public-distros.result }}
          MODE: ${{ inputs.mode }}
        run: |
          test "$CATALOG" = success
          test "$CATALOG_UNIT" = success
          test "$RESOLVER_UNIT" = success
          test "$PUBLIC_HOSTS" = success
          test "$PUBLIC_NIXOS" = success
          test "$PUBLIC_DISTROS" = success
          case "$MODE" in candidate|released) ;; *) exit 1 ;; esac
          python -m ci.installer_public_evidence public-evidence "$MODE" '${{ inputs.release_tag }}' \
            --nixos public-nixos-evidence --distros public-distro-evidence
