name: Model Pages

on:
  pull_request:
    paths:
      - models/**
      - installer/**
      - tests/test_model_manifest.py
      - .github/workflows/model-pages.yml
      - .github/workflows/install-pages.yml
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

concurrency:
  group: clud-pages-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-site:
    name: Check and stage model Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      result: ${{ steps.stage.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publisher unit tests
        run: |
          python -m pip install pytest running-process
          python -m pytest -q tests/test_model_manifest.py
      - name: Stage complete Pages artifact
        id: stage
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then trigger=nightly; else trigger=manual; fi
          python -m models.publish site --trigger "$trigger" --github-output "$GITHUB_OUTPUT"
      - name: Validate reused installer catalog and new model document
        if: steps.stage.outputs.result == 'publish'
        run: |
          python -m pip install 'git+https://github.com/zackees/manifest.json@main'
          manifest-validate site/install/manifest.json
          python -m pytest -q tests/test_model_manifest.py
          python -m json.tool site/models/manifest.json > /dev/null
      - uses: actions/configure-pages@v5
        if: steps.stage.outputs.result == 'publish'
      - uses: actions/upload-pages-artifact@v3
        if: steps.stage.outputs.result == 'publish'
        with:
          path: site

  deploy-site:
    name: Deploy model Pages
    needs: build-site
    if: needs.build-site.outputs.result == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke public model and installer manifests
        run: |
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 https://zackees.github.io/clud/models/manifest.json -o models.json
          mkdir -p public-site/install
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 https://zackees.github.io/clud/index.html -o public-site/index.html
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 https://zackees.github.io/clud/install/index.html -o public-site/install/index.html
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 https://zackees.github.io/clud/install/manifest.json -o public-site/install/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          models = json.loads(Path('models.json').read_text(encoding='utf-8'))
          assert models['schema_version'] == 1
          assert models['defaults']['codex']['model'] == models['families']['sol']
          assert models['defaults']['codex']['effort'] == 'low'
          PY
          python -m installer.verify_site public-site
