name: Installer Pages

on:
  pull_request:
    paths:
      - installer/catalog.py
      - installer/site.py
      - installer/verify_site.py
      - tests/test_installer_catalog.py
      - .github/workflows/install-pages.yml
      - ci/act_ci.sh
      - bosn.toml
  push:
    branches: [main]
    paths:
      - installer/catalog.py
      - installer/site.py
      - installer/verify_site.py
      - .github/workflows/install-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-site:
    name: Verify release history and build Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Catalog and site unit tests
        run: |
          python -m pip install pytest running-process
          python -m pytest -q tests/test_installer_catalog.py
      - name: Generate every installable published version
        run: python -m installer.site site
      - name: Validate catalog schema, semantics, and site
        run: |
          python -m pip install 'git+https://github.com/zackees/manifest.json@main'
          manifest-validate site/install/manifest.json
          python -m installer.verify_site site
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy-site:
    name: Deploy installer Pages
    needs: build-site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke public Pages without authentication
        run: |
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 https://zackees.github.io/clud/index.html -o root.html
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 https://zackees.github.io/clud/install/index.html -o install.html
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 https://zackees.github.io/clud/install/manifest.json -o manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert catalog['kind'] == 'Catalog'
          assert catalog['channels']['latest-stable'] in Path('install.html').read_text(encoding='utf-8')
          assert "location.replace('/clud/install/index.html')" in Path('root.html').read_text(encoding='utf-8')
          PY
