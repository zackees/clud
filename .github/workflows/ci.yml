name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI full {0}', inputs.candidate_sha) || 'CI' }}

# The single push/PR entrypoint. Replaces 24 per-platform leaf workflows.
# Design + rationale: docs/architecture/ci.md
#
# Shape: build once per target triple on Linux, then execute the resulting
# bundle on native runners that have no Rust toolchain at all.
#
# ## Why this file is repetitive instead of one build matrix
#
# `needs:` on a matrix job is all-or-nothing in GitHub Actions: a single
# `test` matrix depending on a single `build` matrix would make the Linux
# tests -- ready first -- wait for the slowest cross-build in the set. GitHub
# offers no per-leg dependency edge, so each triple gets its own build/test
# job pair and its own `needs:`. The Linux lane reports red/green ~15 minutes
# before the slowest lane finishes.
#
# The triple -> {build host, cross strategy, exec runner} mapping is still
# owned by ci/ci_matrix.py; tests/test_ci_matrix.py asserts this file has not
# drifted from it.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # Inert today: no merge queue is configured for main (#1651), so no
  # merge_group run has ever happened. Kept so a future queue gets full mode.
  merge_group:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reachable commit SHA to validate
        required: true
        type: string

# Deliberately NO `profile` input anywhere in this file. Release builds are
# reachable only from auto-release.yml; _build-target.yml enforces that.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # setup-soldr's yank audit deletes only the exact poisoned cache keys it
  # restored; without this permission it must fail closed.
  actions: write

jobs:
  # ---------------------------------------------------------------- static --
  # Everything platform-independent, once, on the cheapest runner. Previously
  # ruff + cargo fmt + banned_imports each ran six times. Ordered cheapest-first
  # inside ci/lint.py so a ruff error reds out in well under a minute.
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.tier }}
      source_ref: ${{ steps.source.outputs.ref }}
      # zackees/ci.yml GATE-008/010: 'true' only on a PR whose head carries a
      # stamp-valid `Ci-Attestation:` for every gate ci-attestations.yml maps
      # to the job, inside local-gate.toml's [gate.trust] policy as committed
      # on the base. Never 'true' on push or dispatch. See
      # docs/architecture/ci.md#attested-skip-gate-008010.
      skip_dylint: ${{ steps.gate.outputs.skip_dylint }}
      skip_lint-linux-x64: ${{ steps.gate.outputs.skip_lint-linux-x64 }}
      skip_build-linux-x64: ${{ steps.gate.outputs.skip_build-linux-x64 }}
      skip_test-linux-x64-unit: ${{ steps.gate.outputs.skip_test-linux-x64-unit }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: Verify source and workflow provenance
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::invalid source SHA'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REF" ]] || { echo '::error::checkout SHA mismatch'; exit 1; }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            git merge-base --is-ancestor "$SOURCE_REF" "$EVENT_SHA" || { echo '::error::candidate is not on selected branch'; exit 1; }
            git diff --quiet "$SOURCE_REF" "$EVENT_SHA" -- .github/workflows .github/actions ci || { echo '::error::workflow or CI helpers changed since candidate SHA'; exit 1; }
            echo 'PROVENANCE_VERIFIED=true' >> "$GITHUB_ENV"
          fi
          echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve CI mode and candidate SHA
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_TIER: full
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PROVENANCE_VERIFIED: ${{ env.PROVENANCE_VERIFIED }}
        run: python -m ci.ci_matrix
      # Pinned like local-gate.toml's uvx command. Stdlib only: nothing to
      # install, and it reads the base commit's policy from the full history
      # checked out above. It fails closed (every skip_* stays unset) on any
      # reason code but `trusted`.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          repository: zackees/ci.yml
          ref: 98fd662a48df43fe016c45a1f845e345b52fecef
          path: .ci-lint
          persist-credentials: false
          sparse-checkout: ci_lint
      - name: Local gate attestation
        id: gate
        if: github.event_name == 'pull_request'
        run: PYTHONPATH=.ci-lint python -m ci_lint local-gate verify --repo . --trust --github-output
      # actions/checkout only writes inside the workspace, and ci_lint is not
      # clud code: the static checks below (banned_imports, ruff) would scan
      # it. Drop it before they run.
      - name: Drop ci_lint checkout
        if: always() && github.event_name == 'pull_request'
        run: rm -rf .ci-lint
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.19"
          # Local-runner signal (ACT=true; act2 keeps RUNNER_ENVIRONMENT
          # github-hosted, so caching itself needs no override). setup-uv
          # prunes wheels before saving, cheap on GitHub's network but it
          # empties a local cache, and it has no runner-aware knob: exception
          # zackees/ci.yml#226. Separate key so the hosted entry stays pruned.
          prune-cache: ${{ !env.ACT }}
          cache-suffix: ${{ env.ACT && 'act-unpruned' || '' }}
      - name: Sync
        run: uv sync --frozen --group dev --no-install-project --python 3.11
      - name: Setup soldr
        uses: zackees/setup-soldr@v0
        env:
          SOLDR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          cache: true
          # setup-soldr#559: a failed or cancelled job saves no build outputs
          # (its store may be partial; an exact-hit key is never re-saved).
          job-status: ${{ job.status }}
          build-cache-mode: thin
          shims: true
          preserve-source-mtimes: true
          solo-toolchain-cache: true
          cache-key-suffix: static
          prebuild-deps: none
      # `.venv/bin/python`, not `uv run`: pyproject sets build-backend = "soldr",
      # so `uv run` would sync the project and kick off a full PEP 517 maturin
      # build of the Rust binary. See lint:8-24 for the same workaround.
      - name: Static checks
        run: .venv/bin/python -m ci.lint --static-only

  # ---------------------------------------------------------------- dylint --
  # Dylint is required in every mode. The reusable workflow runs the custom
  # lint on each supported host's selected Rust source.
  dylint:
    name: Dylint
    needs: static
    if: needs.static.outputs.skip_dylint != 'true'
    uses: ./.github/workflows/_dylint.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}

  # ----------------------------------------------------------------- core ---
  # Minimal runs Linux x64 unit tests. The Linux integration suite alone cost
  # 6.87 runner-minutes in the measured minimal run (#35845956093), taking it
  # above the 12.5% routine/full budget; ci-test and full retain that suite.
  # ci-test also adds Windows x64; ci-full and SHA-pinned dispatches add the
  # other architectures (a merge_group event would too, but none is configured).

  # Clippy used to run inside build-linux-x64, serially ahead of the compile,
  # so every PR waited ~41 s on it between Static and the unit suite even
  # though the unit lane consumes none of its output. It now runs beside the
  # build. It shares the build job's zccache namespace (cache-key-suffix
  # build-<triple>) read-only: two writers to one immutable key race, and the
  # build job's outputs are the ones the next run needs.
  lint-linux-x64:
    name: Clippy linux-x64
    needs: static
    # windows mode keeps these routine lanes too (#1652): without a merge
    # queue, CI OK green must imply Linux passed on the same head SHA.
    if: needs.static.outputs.mode != '' && needs.static.outputs.skip_lint-linux-x64 != 'true'
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      strategy: soldr
      clippy: true
      compile: false
      bundle: false
      # Doc-tests ride here, beside the build rather than ahead of the unit
      # lanes (_build-target.yml's Doc tests step).
      doctest: true
      save-cache: "false"

  build-linux-x64:
    name: Build linux-x64
    needs: static
    # windows mode keeps these routine lanes too (#1652): without a merge
    # queue, CI OK green must imply Linux passed on the same head SHA.
    if: needs.static.outputs.mode != '' && needs.static.outputs.skip_build-linux-x64 != 'true'
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      strategy: soldr
      # Linux x64 clippy runs in lint-linux-x64, off this job's critical path.
      clippy: false

  # The unit suite is CPU-bound and a hosted runner is two physical cores, so
  # in-process parallelism (pytest-xdist) measured slower, not faster. It runs
  # as independent jobs instead: the Rust harnesses, and each half of the
  # pytest suite (ci/pytest_shard.py). LINUX_X64_UNIT_SHARDS in ci/ci_matrix.py
  # owns the names; ci/release_gate.py requires one job per shard.
  test-linux-x64-unit:
    name: Test linux-x64 (unit)
    needs: [static, build-linux-x64]
    if: needs.static.outputs.skip_test-linux-x64-unit != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [rust, py1of2, py2of2]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      suite: unit
      shard: ${{ matrix.shard }}

  test-linux-x64-integration:
    name: Test linux-x64 (integration)
    needs: [static, build-linux-x64]
    if: needs.static.outputs.mode != 'minimal' && needs.static.outputs.mode != 'windows'
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      suite: integration

  # #1323: real Claude Code on the scripted mock agent backend. Full mode
  # only (ci-full, or a merge_group event if a queue is ever enabled): it installs Claude Code from npm.
  test-linux-x64-harness:
    name: Test linux-x64 (harness)
    needs: [static, build-linux-x64]
    if: needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      suite: harness

  build-windows-x64:
    name: Build windows-x64
    needs: static
    # `windows` is the ci-windows iteration mode (#1310).
    if: needs.static.outputs.mode == 'extended' || needs.static.outputs.mode == 'full' || needs.static.outputs.mode == 'windows'
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-pc-windows-msvc
      runs-on: ubuntu-24.04
      strategy: soldr
      # The Windows x64 cfg surface.
      clippy: true

  test-windows-x64:
    name: Test windows-x64
    needs: [static, build-windows-x64]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-pc-windows-msvc
      runs-on: windows-2025
      suite: ${{ matrix.suite }}

  # macOS ARM is core because it cross-compiles on Linux like every other
  # triple. `soldr prepare --target aarch64-apple-darwin` provisions the
  # target-shaped Apple SDK, which is what supplies the `-framework Accelerate`
  # that vendor/whisper-rs-sys/build.rs:27-28 emits unconditionally for apple
  # targets. Before that, darwin needed either a hand-fetched SDK behind a
  # MACOS_SDK_URL repo variable or a cold C++ build on a native macOS runner --
  # the scarcest runner class, and a ~20 minute tax on every PR push.
  build-macos-arm:
    name: Build macos-arm
    needs: static
    if: needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-apple-darwin
      runs-on: ubuntu-24.04
      strategy: soldr
      # macOS-only modules are not covered by Linux's cfg(unix).
      clippy: true

  test-macos-arm:
    name: Test macos-arm
    needs: [static, build-macos-arm]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-apple-darwin
      runs-on: macos-15
      suite: ${{ matrix.suite }}

  # ----------------------------------------------------------------- full ---
  # Second architecture of each OS. Runs only in full mode; release attempts
  # must request a SHA-pinned full run before publication.

  build-linux-arm:
    name: Build linux-arm
    needs: static
    if: needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      strategy: soldr
      clippy: false

  test-linux-arm:
    name: Test linux-arm
    needs: [static, build-linux-arm]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-unknown-linux-gnu
      runs-on: ubuntu-24.04-arm
      suite: ${{ matrix.suite }}

  build-windows-arm:
    name: Build windows-arm
    needs: static
    if: needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-pc-windows-msvc
      runs-on: ubuntu-24.04
      # The cheapest cross in the set: whisper-rs is cfg-excluded on this
      # triple (crates/clud-bin/Cargo.toml:149), so there is no C++ or CMake
      # at all -- only ring/blake3 need the MSVC CRT that `soldr prepare`
      # provisions.
      strategy: soldr
      # Windows ARM has target-specific voice worker code.
      clippy: true

  test-windows-arm:
    name: Test windows-arm
    needs: [static, build-windows-arm]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-pc-windows-msvc
      runs-on: windows-11-arm
      suite: ${{ matrix.suite }}

  build-macos-x64:
    name: Build macos-x64
    needs: static
    if: needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-apple-darwin
      runs-on: ubuntu-24.04
      strategy: soldr
      clippy: false

  test-macos-x64:
    name: Test macos-x64
    needs: [static, build-macos-x64]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-apple-darwin
      runs-on: macos-15-intel
      suite: ${{ matrix.suite }}

  # ---------------------------------------------------------------- gate ----
  # Single required status check. Branch protection points here, so adding or
  # removing a triple never requires touching branch-protection settings.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - static
      - dylint
      - lint-linux-x64
      - build-linux-x64
      - test-linux-x64-unit
      - test-linux-x64-integration
      - test-linux-x64-harness
      - build-windows-x64
      - test-windows-x64
      - build-macos-arm
      - test-macos-arm
      - build-linux-arm
      - test-linux-arm
      - build-windows-arm
      - test-windows-arm
      - build-macos-x64
      - test-macos-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # `always()` plus explicit result inspection is required: a failing
      # `needs` would otherwise skip this job and leave the check pending
      # forever rather than reporting red.
      #
      # Skips are permitted only outside the resolved mode's required cells,
      # plus a MINIMAL lane the static job skipped as attested (GATE-008/010):
      # MINIMAL maps exactly that case to success. WINDOWS and FULL read raw
      # results, and full labels never trust, so they cannot see one.
      # Explicit result lists ensure a malformed condition cannot green a
      # run that never built or tested a required target.
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
          MODE: ${{ needs.static.outputs.mode }}
          STATIC: ${{ needs.static.result }}
          WINDOWS: >-
            ${{ needs.dylint.result }}
            ${{ needs.build-windows-x64.result }}
            ${{ needs.test-windows-x64.result }}
          MINIMAL: >-
            ${{ needs.static.result }}
            ${{ needs.static.outputs.skip_dylint == 'true' && needs.dylint.result == 'skipped' && 'success' || needs.dylint.result }}
            ${{ needs.static.outputs.skip_lint-linux-x64 == 'true' && needs.lint-linux-x64.result == 'skipped' && 'success' || needs.lint-linux-x64.result }}
            ${{ needs.static.outputs.skip_build-linux-x64 == 'true' && needs.build-linux-x64.result == 'skipped' && 'success' || needs.build-linux-x64.result }}
            ${{ needs.static.outputs.skip_test-linux-x64-unit == 'true' && needs.test-linux-x64-unit.result == 'skipped' && 'success' || needs.test-linux-x64-unit.result }}
          EXTENDED: >-
            ${{ needs.test-linux-x64-integration.result }}
            ${{ needs.build-windows-x64.result }}
            ${{ needs.test-windows-x64.result }}
          FULL: >-
            ${{ needs.dylint.result }}
            ${{ needs.test-linux-x64-harness.result }}
            ${{ needs.build-macos-arm.result }}
            ${{ needs.test-macos-arm.result }}
            ${{ needs.build-linux-arm.result }}
            ${{ needs.test-linux-arm.result }}
            ${{ needs.build-windows-arm.result }}
            ${{ needs.test-windows-arm.result }}
            ${{ needs.build-macos-x64.result }}
            ${{ needs.test-macos-x64.result }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "::error::one or more CI jobs failed or were cancelled"
            exit 1
          fi
          case "$MODE" in minimal|extended|full|windows) ;; *)
            echo "::error::CI mode was not resolved (got '$MODE')"
            exit 1;;
          esac
          # ci-windows (#1310) skips Linux integration and the other targets,
          # but still requires every minimal lane (#1652): no merge queue
          # exists (#1651), so this run is the only pre-merge Linux test of
          # the PR head SHA. Same-run results; no cross-run lookup.
          if [ "$MODE" = "windows" ]; then
            for result in $MINIMAL $WINDOWS; do
              if [ "$result" != "success" ]; then
                echo "::error::a ci-windows lane did not run to success (got '$result')"
                exit 1
              fi
            done
            echo "ci-windows: minimal Linux + Windows x64 lanes passed (macOS not run)"
            exit 0
          fi
          for result in $MINIMAL; do
            if [ "$result" != "success" ]; then
              echo "::error::a minimal lane did not run to success (got '$result')"
              exit 1
            fi
          done
          if [ "$MODE" = "extended" ] || [ "$MODE" = "full" ]; then
            for result in $EXTENDED; do
              if [ "$result" != "success" ]; then
                echo "::error::an extended lane did not run to success (got '$result')"
                exit 1
              fi
            done
          fi
          if [ "$MODE" = "full" ]; then
            for result in $FULL; do
              if [ "$result" != "success" ]; then
                echo "::error::a full-tier lane did not run to success (got '$result')"
                exit 1
              fi
            done
          fi
