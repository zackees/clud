name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI full {0}', inputs.candidate_sha) || 'CI' }}

# The single push/PR entrypoint. Replaces 24 per-platform leaf workflows.
# Design + rationale: docs/architecture/ci.md
#
# Shape: build once per target triple on Linux, then execute the resulting
# bundle on native runners that have no Rust toolchain at all.
#
# ## Why this file is repetitive instead of one build matrix
#
# `needs:` on a matrix job is all-or-nothing in GitHub Actions: a single
# `test` matrix depending on a single `build` matrix would make the Linux
# tests -- ready first -- wait for the slowest cross-build in the set. GitHub
# offers no per-leg dependency edge, so each triple gets its own build/test
# job pair and its own `needs:`. The Linux lane reports red/green ~15 minutes
# before the slowest lane finishes.
#
# The triple -> {build host, cross strategy, exec runner} mapping is still
# owned by ci/ci_matrix.py; tests/test_ci_matrix.py asserts this file has not
# drifted from it.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reachable commit SHA to validate
        required: true
        type: string

# Deliberately NO `profile` input anywhere in this file. Release builds are
# reachable only from auto-release.yml; _build-target.yml enforces that.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # setup-soldr's yank audit deletes only the exact poisoned cache keys it
  # restored; without this permission it must fail closed.
  actions: write

jobs:
  # ---------------------------------------------------------------- static --
  # Everything platform-independent, once, on the cheapest runner. Previously
  # ruff + cargo fmt + banned_imports each ran six times. Ordered cheapest-first
  # inside ci/lint.py so a ruff error reds out in well under a minute.
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.tier }}
      source_ref: ${{ steps.source.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: Verify source and workflow provenance
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::invalid source SHA'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_REF" ]] || { echo '::error::checkout SHA mismatch'; exit 1; }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            git merge-base --is-ancestor "$SOURCE_REF" "$EVENT_SHA" || { echo '::error::candidate is not on selected branch'; exit 1; }
            git diff --quiet "$SOURCE_REF" "$EVENT_SHA" -- .github/workflows .github/actions ci || { echo '::error::workflow or CI helpers changed since candidate SHA'; exit 1; }
            echo 'PROVENANCE_VERIFIED=true' >> "$GITHUB_ENV"
          fi
          echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve CI mode and candidate SHA
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_TIER: full
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PROVENANCE_VERIFIED: ${{ env.PROVENANCE_VERIFIED }}
        run: python -m ci.ci_matrix
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --frozen --group dev --no-install-project --python 3.11
      - name: Setup soldr
        uses: zackees/setup-soldr@v0
        env:
          SOLDR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          cache: true
          build-cache-mode: thin
          shims: true
          preserve-source-mtimes: true
          solo-toolchain-cache: true
          cache-key-suffix: static
          prebuild-deps: none
      # `.venv/bin/python`, not `uv run`: pyproject sets build-backend = "soldr",
      # so `uv run` would sync the project and kick off a full PEP 517 maturin
      # build of the Rust binary. See lint:8-24 for the same workaround.
      - name: Static checks
        run: .venv/bin/python -m ci.lint --static-only

  # ---------------------------------------------------------------- dylint --
  # Dylint installs a nightly toolchain and runs only in full mode. The merge
  # queue and explicitly full PRs therefore exercise it before merge.
  dylint:
    name: Dylint
    needs: static
    if: needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_dylint.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}

  # ----------------------------------------------------------------- core ---
  # Minimal runs Linux x64. ci-test adds Windows x64 and macOS ARM; ci-full,
  # merge_group, and SHA-pinned dispatches add the other architectures.

  build-linux-x64:
    name: Build linux-x64
    needs: static
    if: needs.static.outputs.mode != ''
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      strategy: soldr
      clippy: true

  test-linux-x64:
    name: Test linux-x64
    needs: [static, build-linux-x64]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      suite: ${{ matrix.suite }}

  build-windows-x64:
    name: Build windows-x64
    needs: static
    if: needs.static.outputs.mode == 'extended' || needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-pc-windows-msvc
      runs-on: ubuntu-24.04
      strategy: soldr
      # The Windows x64 cfg surface.
      clippy: true

  test-windows-x64:
    name: Test windows-x64
    needs: [static, build-windows-x64]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-pc-windows-msvc
      runs-on: windows-2025
      suite: ${{ matrix.suite }}

  # macOS ARM is core because it cross-compiles on Linux like every other
  # triple. `soldr prepare --target aarch64-apple-darwin` provisions the
  # target-shaped Apple SDK, which is what supplies the `-framework Accelerate`
  # that vendor/whisper-rs-sys/build.rs:27-28 emits unconditionally for apple
  # targets. Before that, darwin needed either a hand-fetched SDK behind a
  # MACOS_SDK_URL repo variable or a cold C++ build on a native macOS runner --
  # the scarcest runner class, and a ~20 minute tax on every PR push.
  build-macos-arm:
    name: Build macos-arm
    needs: static
    if: needs.static.outputs.mode == 'extended' || needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-apple-darwin
      runs-on: ubuntu-24.04
      strategy: soldr
      # macOS-only modules are not covered by Linux's cfg(unix).
      clippy: true

  test-macos-arm:
    name: Test macos-arm
    needs: [static, build-macos-arm]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-apple-darwin
      runs-on: macos-15
      suite: ${{ matrix.suite }}

  # ----------------------------------------------------------------- full ---
  # Second architecture of each OS. Runs only in full mode; release attempts
  # must request a SHA-pinned full run before publication.

  build-linux-arm:
    name: Build linux-arm
    needs: static
    if: needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-unknown-linux-gnu
      runs-on: ubuntu-24.04
      strategy: soldr
      clippy: false

  test-linux-arm:
    name: Test linux-arm
    needs: [static, build-linux-arm]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-unknown-linux-gnu
      runs-on: ubuntu-24.04-arm
      suite: ${{ matrix.suite }}

  build-windows-arm:
    name: Build windows-arm
    needs: static
    if: needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-pc-windows-msvc
      runs-on: ubuntu-24.04
      # The cheapest cross in the set: whisper-rs is cfg-excluded on this
      # triple (crates/clud-bin/Cargo.toml:149), so there is no C++ or CMake
      # at all -- only ring/blake3 need the MSVC CRT that `soldr prepare`
      # provisions.
      strategy: soldr
      # Windows ARM has target-specific voice worker code.
      clippy: true

  test-windows-arm:
    name: Test windows-arm
    needs: [static, build-windows-arm]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: aarch64-pc-windows-msvc
      runs-on: windows-11-arm
      suite: ${{ matrix.suite }}

  build-macos-x64:
    name: Build macos-x64
    needs: static
    if: needs.static.outputs.mode == 'full'
    uses: ./.github/workflows/_build-target.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-apple-darwin
      runs-on: ubuntu-24.04
      strategy: soldr
      clippy: false

  test-macos-x64:
    name: Test macos-x64
    needs: [static, build-macos-x64]
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    uses: ./.github/workflows/_run-tests.yml
    with:
      source_ref: ${{ needs.static.outputs.source_ref }}
      target: x86_64-apple-darwin
      runs-on: macos-15-intel
      suite: ${{ matrix.suite }}

  # ---------------------------------------------------------------- gate ----
  # Single required status check. Branch protection points here, so adding or
  # removing a triple never requires touching branch-protection settings.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - static
      - dylint
      - build-linux-x64
      - test-linux-x64
      - build-windows-x64
      - test-windows-x64
      - build-macos-arm
      - test-macos-arm
      - build-linux-arm
      - test-linux-arm
      - build-windows-arm
      - test-windows-arm
      - build-macos-x64
      - test-macos-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # `always()` plus explicit result inspection is required: a failing
      # `needs` would otherwise skip this job and leave the check pending
      # forever rather than reporting red.
      #
      # Skips are permitted only outside the resolved mode's required cells.
      # Explicit result lists ensure a malformed condition cannot green a
      # run that never built or tested a required target.
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
          MODE: ${{ needs.static.outputs.mode }}
          MINIMAL: >-
            ${{ needs.static.result }}
            ${{ needs.build-linux-x64.result }}
            ${{ needs.test-linux-x64.result }}
          EXTENDED: >-
            ${{ needs.build-windows-x64.result }}
            ${{ needs.test-windows-x64.result }}
            ${{ needs.build-macos-arm.result }}
            ${{ needs.test-macos-arm.result }}
          FULL: >-
            ${{ needs.dylint.result }}
            ${{ needs.build-linux-arm.result }}
            ${{ needs.test-linux-arm.result }}
            ${{ needs.build-windows-arm.result }}
            ${{ needs.test-windows-arm.result }}
            ${{ needs.build-macos-x64.result }}
            ${{ needs.test-macos-x64.result }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"result": *"(failure|cancelled)"'; then
            echo "::error::one or more CI jobs failed or were cancelled"
            exit 1
          fi
          case "$MODE" in minimal|extended|full) ;; *)
            echo "::error::CI mode was not resolved (got '$MODE')"
            exit 1;;
          esac
          for result in $MINIMAL; do
            if [ "$result" != "success" ]; then
              echo "::error::a minimal lane did not run to success (got '$result')"
              exit 1
            fi
          done
          if [ "$MODE" = "extended" ] || [ "$MODE" = "full" ]; then
            for result in $EXTENDED; do
              if [ "$result" != "success" ]; then
                echo "::error::an extended lane did not run to success (got '$result')"
                exit 1
              fi
            done
          fi
          if [ "$MODE" = "full" ]; then
            for result in $FULL; do
              if [ "$result" != "success" ]; then
                echo "::error::a full-tier lane did not run to success (got '$result')"
                exit 1
              fi
            done
          fi
