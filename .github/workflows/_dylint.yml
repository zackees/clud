name: Dylint

# Dylint is inherently Linux-only here: it needs a nightly toolchain with
# rustc-dev/llvm-tools and builds a cdylib driver for the host. It never ran on
# macOS/Windows and `ci/lint.py` never invokes it, so the "no dylint off Linux"
# requirement is satisfied structurally -- this workflow pins it to ubuntu and
# nothing else can reach it.
#
# Previously dylint.yml fired on BOTH `push` and `pull_request`, so every PR ran
# it twice. As a workflow_call target it runs exactly once, under ci.yml's
# concurrency group.

on:
  workflow_call:
  # Kept from the old dylint.yml: dylint is off the PR path now (ci.yml runs it
  # only for non-PR events), so a manual entrypoint is the way to check a
  # branch's lint state before opening a PR.
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ZCCACHE_DISABLE: "1"
  # See zackees/soldr#1879 -- authenticates soldr's cross-repo managed-tool
  # lookups so they are not rate-limited to 60 req/hr per runner IP.
  SOLDR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  dylint:
    name: Dylint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/setup-soldr@v0
        with:
          version: 0.9.9
          cache: true
          toolchain: 1.94.1
          cache-key-suffix: dylint
          prebuild-deps: none
          linker: platform-default
          cache-payload-warn-bytes: 2GiB
      - name: Install Dylint nightly toolchain
        timeout-minutes: 10
        run: rustup toolchain install nightly-2026-04-16 --component llvm-tools-preview --component rust-src --component rustc-dev --profile minimal
      - name: Install Dylint
        timeout-minutes: 10
        run: soldr --no-cache cargo install cargo-dylint dylint-link --version 6.0.4 --locked
      - name: Check dylint formatting
        run: soldr --no-cache cargo fmt --manifest-path dylints/ban_manual_slash_normalize/Cargo.toml --all -- --check
      - name: Test dylint crate
        run: RUSTUP_TOOLCHAIN=nightly-2026-04-16 soldr --no-cache cargo test --manifest-path dylints/ban_manual_slash_normalize/Cargo.toml
      - name: Run dylint over workspace
        run: |
          export PATH="${CARGO_HOME}/bin:${PATH}"
          RUSTUP_TOOLCHAIN=nightly-2026-04-16 soldr --no-cache cargo dylint --all -- --workspace --all-targets
