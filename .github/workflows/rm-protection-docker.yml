name: RM protection (Docker)

# Inert JSON corpus + dry-run operands + disposable-file execution gate.
# Hazardous shell command text is never evaluated. The only execution check
# removes its own disposable file, with both CI and actual Docker evidence.
# Manual/reusable; the source corpus also runs in every PR's Rust unit lane.

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SOLDR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rm-protection:
    name: rm -rf $VAR guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          target: x86_64-unknown-linux-gnu
          strategy: native
          soldr-token: ${{ secrets.GITHUB_TOKEN }}

      # Only the hook and shim binaries, not the workspace. `ci.xbuild compile` builds
      # `--workspace --bins`, which on a standard runner exhausts memory and
      # gets the compiler killed by the OOM reaper (soldr#2781). This check
      # needs exactly two binaries, so it asks for those, and caps
      # parallelism so a burst of codegen units cannot reach the same limit.
      # Still routed through soldr, per the repo's toolchain rule.
      - name: Build the hook and shim binaries
        env:
          CARGO_BUILD_JOBS: "2"
          SOLDR_JOBS: "2"
        run: soldr cargo build -p clud --bin clud-block-bad-cmd --bin clud-shim

      - name: Locate the hook binary
        id: binary
        run: |
          set -euo pipefail
          for candidate in \
            target/debug/clud-block-bad-cmd \
            target/x86_64-unknown-linux-gnu/debug/clud-block-bad-cmd; do
            if [ -x "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              echo "shim=$(dirname "$candidate")/clud-shim" >> "$GITHUB_OUTPUT"
              echo "using $candidate"
              exit 0
            fi
          done
          echo "hook binary not found after compile" >&2
          exit 1

      # The base image tracks the runner's libc, because the binary is copied
      # in rather than rebuilt. A mismatch shows up unmistakably as exit 127
      # on every case rather than as a silent pass.
      - name: Build the check image
        run: >
          docker build
          -f ci/docker/rm_protection/Dockerfile
          --build-arg BASE=ubuntu:24.04
          --build-arg BINARY=${{ steps.binary.outputs.path }}
          --build-arg SHIM_BINARY=${{ steps.binary.outputs.shim }}
          -t clud-rm-protection:ci
          .

      # No network, read-only root, unprivileged, all capabilities dropped,
      # and disposable tmpfs paths. /work permits fixture executables; no host
      # directory is writable. Nothing of the checkout is
      # mounted, so the container has nothing to lose even in the failure mode
      # this check exists to prevent.
      - name: Verify every rm shape is refused
        run: >
          docker run --rm
          --network none
          --read-only
          --cap-drop ALL
          --security-opt no-new-privileges
          --tmpfs /tmp:rw,exec,nosuid,mode=1777
          --tmpfs /work:rw,exec,nosuid,uid=10001,gid=10001,mode=0700
          --tmpfs /home/checker:rw,noexec,nosuid,uid=10001,gid=10001,mode=0700
          clud-rm-protection:ci
