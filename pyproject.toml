[build-system]
# Exact pin, deliberately. An unbounded `soldr>=X` meant every build on
# every branch silently adopted the newest soldr on PyPI the moment it was
# published: zackees/soldr#1934 turned `main` red within hours, on branches
# whose *toolchain* soldr was pinned to a known-good version, because this
# line resolves the *build backend* independently at build time. Bump it in
# the same commit as every `setup-soldr` version under `.github/` and
# `./install`'s default —
# `tests/test_packaging_metadata.py` asserts they agree. See DD-020.
requires = ["soldr==0.8.40"]
build-backend = "soldr"

[project]
name = "clud"
version = "2.7.1"
description = "Fast Rust CLI for running Claude Code and Codex in YOLO mode"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Clud Proprietary License" }
license-files = ["LICENSE"]
authors = [{ name = "Zach Vorhies" }]
keywords = ["claude", "codex", "cli", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zackees/clud"
Repository = "https://github.com/zackees/clud"
Issues = "https://github.com/zackees/clud/issues"

[dependency-groups]
# Everything needed to RUN the test suites and nothing needed to BUILD.
# CI exec jobs (.github/actions/setup-exec) sync only this group: they have no
# Rust toolchain by construction, so cmake and maturin are dead weight there —
# ~150 MB of wheels downloaded onto the scarcest runners in the pool.
# The WASM CLI test uses its deterministic checked-in fixture, so the test
# environment needs no external C/C++ compiler.
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "psutil>=5.9",
    "running-process==4.10.1",
]
dev = [
    { include-group = "test" },
    "cmake>=3.26",
    # No [zig] extra: zig is retired from every lane (#859/#863) — the extra
    # only pulled ~50 MB of ziglang into each dev venv for a flag nothing
    # passes anymore.
    "maturin>=1.7,<2",
    "ruff>=0.8.0",
]
# soldr is intentionally NOT a Python dev dep — install it via ./install
# (or `./install --global`) which fetches the binary from
# https://github.com/zackees/soldr/releases. CI uses zackees/setup-soldr@v0.

[tool.maturin]
manifest-path = "crates/clud-bin/Cargo.toml"
bindings = "bin"
python-source = "src"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.py" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/*.toml" },
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers"]
testpaths = ["tests"]
# `tests/` is a package (`tests/__init__.py`), so pytest's prepend import mode
# inserts the repo root — not `tests/` — onto sys.path. That breaks the
# top-level `import _subprocess_helpers` in tests/integration/conftest.py, which
# aborts collection of BOTH the unit and integration lanes on every platform.
# Put `tests/` on sys.path explicitly so the bare helper imports resolve.
pythonpath = ["tests"]
# Any single test that runs longer than this is considered hung; pytest-timeout
# will interrupt it and dump a stack trace pointing at the exact line. Without
# this, a stuck subprocess call (e.g. stderr.readline() on Windows when the
# child never writes) causes GHA to cancel the whole workflow at 45 minutes
# with no actionable log. The thread method works on Windows where SIGALRM
# isn't available.
timeout = 90
timeout_method = "thread"
markers = [
    "integration: end-to-end tests with mock agents; skipped unless CLUD_INTEGRATION_TESTS=1",
    "real_claude: opt-in secret-free protocol fixtures using an installed Claude Code binary",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803", "N806", "PT009", "PT027"]
